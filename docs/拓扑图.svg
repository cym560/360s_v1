<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c44"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#48a"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="900" fill="#1a1a2e"/>

  <!-- ====== 传感器层 ====== -->
  <text x="600" y="30" text-anchor="middle" fill="#888" font-size="14">传感器层</text>
  <line x1="50" y1="40" x2="1150" y2="40" stroke="#333" stroke-width="1"/>

  <!-- LiDAR -->
  <rect x="400" y="55" width="180" height="50" rx="6" fill="#2a5a3a" stroke="#4a9" stroke-width="2"/>
  <text x="490" y="75" text-anchor="middle" fill="#4f9" font-size="13" font-weight="bold">Livox Mid-360</text>
  <text x="490" y="93" text-anchor="middle" fill="#888" font-size="11">360° LiDAR · 10Hz</text>

  <!-- IMU -->
  <rect x="620" y="55" width="140" height="50" rx="6" fill="#2a3a5a" stroke="#48a" stroke-width="2"/>
  <text x="690" y="75" text-anchor="middle" fill="#48f" font-size="13" font-weight="bold">飞控 IMU</text>
  <text x="690" y="93" text-anchor="middle" fill="#888" font-size="11">pitch / roll</text>

  <!-- 上视激光 -->
  <rect x="200" y="120" width="150" height="40" rx="6" fill="#2a2a3a" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="275" y="138" text-anchor="middle" fill="#999" font-size="12">上视激光测距</text>
  <text x="275" y="152" text-anchor="middle" fill="#666" font-size="10">TFmini Plus (可选)</text>

  <!-- 下视激光 -->
  <rect x="450" y="120" width="150" height="40" rx="6" fill="#2a2a3a" stroke="#666" stroke-width="1"/>
  <text x="525" y="138" text-anchor="middle" fill="#aaa" font-size="12">下视激光测距</text>
  <text x="525" y="152" text-anchor="middle" fill="#888" font-size="10">TFmini Plus</text>

  <!-- ====== ROS 2 节点层 ====== -->
  <text x="600" y="195" text-anchor="middle" fill="#888" font-size="14">ROS 2 节点层 (NVIDIA Jetson Nano)</text>
  <line x1="50" y1="205" x2="1150" y2="205" stroke="#333" stroke-width="1"/>

  <!-- processor_node -->
  <rect x="280" y="225" width="210" height="80" rx="8" fill="#1a3a5a" stroke="#48a" stroke-width="2"/>
  <text x="385" y="250" text-anchor="middle" fill="#6af" font-size="14" font-weight="bold">processor_node</text>
  <text x="385" y="268" text-anchor="middle" fill="#aaa" font-size="11">7阶段感知管线</text>
  <text x="385" y="284" text-anchor="middle" fill="#888" font-size="10">点云 → distances[288]</text>
  <text x="385" y="298" text-anchor="middle" fill="#666" font-size="10">置信度→姿态补偿→滤波→扇区</text>

  <!-- roam_node -->
  <rect x="540" y="225" width="210" height="80" rx="8" fill="#1a3a5a" stroke="#48a" stroke-width="2"/>
  <text x="645" y="250" text-anchor="middle" fill="#6af" font-size="14" font-weight="bold">roam_node</text>
  <text x="645" y="268" text-anchor="middle" fill="#aaa" font-size="11">方向决策引擎</text>
  <text x="645" y="284" text-anchor="middle" fill="#888" font-size="10">distances → roam_target</text>
  <text x="645" y="298" text-anchor="middle" fill="#666" font-size="10">夹点+伪压缩+拓扑+爬升</text>

  <!-- mavlink_node -->
  <rect x="800" y="225" width="210" height="80" rx="8" fill="#1a3a5a" stroke="#48a" stroke-width="2"/>
  <text x="905" y="250" text-anchor="middle" fill="#6af" font-size="14" font-weight="bold">mavlink_node</text>
  <text x="905" y="268" text-anchor="middle" fill="#aaa" font-size="11">MAVLink 桥接</text>
  <text x="905" y="284" text-anchor="middle" fill="#888" font-size="10">ROS ↔ 飞控</text>
  <text x="905" y="298" text-anchor="middle" fill="#666" font-size="10">OBSTACLE + GUIDED 指令</text>

  <!-- watchdog_node -->
  <rect x="800" y="350" width="210" height="60" rx="8" fill="#3a1a1a" stroke="#c44" stroke-width="2"/>
  <text x="905" y="375" text-anchor="middle" fill="#f66" font-size="14" font-weight="bold">watchdog_node</text>
  <text x="905" y="393" text-anchor="middle" fill="#aaa" font-size="11">健康监控 · OK→DEGRADED→FAIL</text>
  <text x="905" y="405" text-anchor="middle" fill="#888" font-size="10">点云超时300ms · 处理超时400ms</text>

  <!-- ====== Topic 层 ====== -->
  <text x="600" y="440" text-anchor="middle" fill="#888" font-size="14">Topic 数据总线</text>
  <line x1="50" y1="450" x2="1150" y2="450" stroke="#333" stroke-width="1"/>

  <!-- distances -->
  <rect x="250" y="465" width="280" height="35" rx="4" fill="#1a2a1a" stroke="#493" stroke-width="1"/>
  <text x="390" y="480" text-anchor="middle" fill="#4a9" font-size="12">/one360s/distances</text>
  <text x="390" y="494" text-anchor="middle" fill="#888" font-size="10">Float32MultiArray[288] · L0[72]+L1[72]+L2[72]+up[72]</text>

  <!-- roam_target -->
  <rect x="560" y="465" width="280" height="35" rx="4" fill="#1a2a1a" stroke="#493" stroke-width="1"/>
  <text x="700" y="480" text-anchor="middle" fill="#4a9" font-size="12">/one360s/roam_target</text>
  <text x="700" y="494" text-anchor="middle" fill="#888" font-size="10">Float32MultiArray[5] · bearing,step,speed,alt,action</text>

  <!-- position -->
  <rect x="100" y="520" width="280" height="35" rx="4" fill="#1a2a1a" stroke="#493" stroke-width="1"/>
  <text x="240" y="535" text-anchor="middle" fill="#4a9" font-size="12">/one360s/position</text>
  <text x="240" y="549" text-anchor="middle" fill="#888" font-size="10">Float32MultiArray[5] · heading,speed,alt,laser,up_laser</text>

  <!-- health -->
  <rect x="800" y="520" width="200" height="35" rx="4" fill="#2a1a1a" stroke="#c44" stroke-width="1"/>
  <text x="900" y="535" text-anchor="middle" fill="#f66" font-size="12">/one360s/health</text>
  <text x="900" y="549" text-anchor="middle" fill="#888" font-size="10">UInt8 · 0=OK 1=DEGRADED 2=FAIL</text>

  <!-- status -->
  <rect x="250" y="570" width="280" height="35" rx="4" fill="#1a2a1a" stroke="#493" stroke-width="1"/>
  <text x="390" y="585" text-anchor="middle" fill="#4a9" font-size="12">/one360s/status</text>
  <text x="390" y="599" text-anchor="middle" fill="#888" font-size="10">String · 帧统计+处理延迟</text>

  <!-- ====== 飞控层 ====== -->
  <text x="600" y="635" text-anchor="middle" fill="#888" font-size="14">飞控层</text>
  <line x1="50" y1="645" x2="1150" y2="645" stroke="#333" stroke-width="1"/>

  <!-- 飞控 -->
  <rect x="350" y="660" width="220" height="70" rx="8" fill="#2a2a2a" stroke="#777" stroke-width="2"/>
  <text x="460" y="685" text-anchor="middle" fill="#ccc" font-size="14" font-weight="bold">Pixhawk / PX4</text>
  <text x="460" y="703" text-anchor="middle" fill="#aaa" font-size="11">GUIDED 模式 · MAVLink</text>
  <text x="460" y="720" text-anchor="middle" fill="#888" font-size="10">OBSTACLE_DISTANCE + POSITION_TARGET</text>

  <!-- 飞控安全网 -->
  <rect x="620" y="660" width="220" height="70" rx="8" fill="#2a1a1a" stroke="#c44" stroke-width="2"/>
  <text x="730" y="683" text-anchor="middle" fill="#f66" font-size="13" font-weight="bold">飞控独立安全网</text>
  <text x="730" y="700" text-anchor="middle" fill="#aaa" font-size="11">RC丢失 → RTL</text>
  <text x="730" y="715" text-anchor="middle" fill="#aaa" font-size="11">低电 → LAND</text>
  <text x="730" y="730" text-anchor="middle" fill="#aaa" font-size="11">Geofence · 最大高度</text>

  <!-- 遥控器 -->
  <rect x="900" y="660" width="180" height="70" rx="8" fill="#2a2a2a" stroke="#fa0" stroke-width="2"/>
  <text x="990" y="685" text-anchor="middle" fill="#fa0" font-size="13" font-weight="bold">遥控器</text>
  <text x="990" y="703" text-anchor="middle" fill="#aaa" font-size="11">模式开关</text>
  <text x="990" y="720" text-anchor="middle" fill="#f66" font-size="11">随时切 Stabilize</text>
  <text x="990" y="735" text-anchor="middle" fill="#888" font-size="10">夺回控制权</text>

  <!-- ====== 数据流箭头 ====== -->
  <!-- LiDAR → processor -->
  <line x1="490" y1="105" x2="420" y2="225" stroke="#4a9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="170" fill="#4a9" font-size="9">PointCloud2 10Hz</text>

  <!-- IMU → processor -->
  <line x1="690" y1="105" x2="480" y2="225" stroke="#48a" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="610" y="160" fill="#48a" font-size="9">pitch/roll</text>

  <!-- processor → distances -->
  <line x1="385" y1="305" x2="390" y2="465" stroke="#4a9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- distances → roam -->
  <line x1="530" y1="483" x2="600" y2="280" stroke="#4a9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="390" fill="#4a9" font-size="9">distances</text>

  <!-- distances → mavlink -->
  <line x1="530" y1="483" x2="870" y2="280" stroke="#4a9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- roam → roam_target -->
  <line x1="645" y1="305" x2="700" y2="465" stroke="#4a9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- roam_target → mavlink -->
  <line x1="840" y1="483" x2="905" y2="305" stroke="#4a9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="410" fill="#4a9" font-size="9">roam_target</text>

  <!-- position → roam -->
  <line x1="380" y1="538" x2="600" y2="305" stroke="#48a" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="500" y="430" fill="#48a" font-size="9">position</text>

  <!-- mavlink → position -->
  <line x1="905" y1="305" x2="380" y2="538" stroke="#48a" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- processor → status -->
  <line x1="385" y1="305" x2="390" y2="570" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- watchdog: distances in -->
  <line x1="530" y1="483" x2="870" y2="375" stroke="#c44" stroke-width="1" marker-end="url(#arrow-red)"/>

  <!-- watchdog: status in -->
  <line x1="530" y1="585" x2="870" y2="395" stroke="#c44" stroke-width="1" marker-end="url(#arrow-red)"/>

  <!-- health out -->
  <line x1="905" y1="410" x2="900" y2="520" stroke="#c44" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- health → mavlink (land trigger) -->
  <line x1="1000" y1="538" x2="960" y2="290" stroke="#f66" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="1030" y="420" fill="#f66" font-size="9">FAIL=强制LAND</text>

  <!-- mavlink → 飞控 (上行) -->
  <line x1="905" y1="305" x2="550" y2="660" stroke="#4a9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="500" fill="#4a9" font-size="9">上行: OBSTACLE + GUIDED</text>

  <!-- 飞控 → mavlink (下行) -->
  <line x1="460" y1="660" x2="880" y2="305" stroke="#48a" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="700" y="500" fill="#48a" font-size="9">下行: ATTITUDE + POSITION + LASER</text>

  <!-- 遥控器 → 飞控 -->
  <line x1="900" y1="695" x2="570" y2="695" stroke="#fa0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="690" fill="#fa0" font-size="10">随时夺控</text>

  <!-- 激光 → 飞控 -->
  <line x1="350" y1="140" x2="420" y2="660" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="525" y1="160" x2="470" y2="660" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ====== 应急链 ====== -->
  <text x="1040" y="800" fill="#f66" font-size="11" font-weight="bold">三重应急保障:</text>
  <text x="1040" y="820" fill="#aaa" font-size="10">1. watchdog FAIL → mavlink → LAND</text>
  <text x="1040" y="838" fill="#aaa" font-size="10">2. 飞控自身 failsafe (RC/电池/围栏)</text>
  <text x="1040" y="856" fill="#aaa" font-size="10">3. 遥控器直接夺控</text>

  <!-- ====== 图例 ====== -->
  <text x="60" y="800" fill="#888" font-size="12" font-weight="bold">图例:</text>
  <line x1="60" y1="815" x2="100" y2="815" stroke="#4a9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="108" y="819" fill="#aaa" font-size="10">数据流</text>
  <line x1="160" y1="815" x2="200" y2="815" stroke="#c44" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="208" y="819" fill="#aaa" font-size="10">应急链路</text>
  <line x1="280" y1="815" x2="320" y2="815" stroke="#f66" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="328" y="819" fill="#aaa" font-size="10">异常触发</text>
  <line x1="400" y1="815" x2="440" y2="815" stroke="#fa0" stroke-width="2"/>
  <text x="448" y="819" fill="#aaa" font-size="10">人工干预</text>
</svg>
